name = "onde-tem"
main = "worker-entry-v3.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "onde-tem-db"
database_id = "91824c37-4c44-4736-af8d-25e362f63146"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "onde-tem-media"

# O WhatsApp administrador e configurado como secret da Cloudflare:
# npx wrangler secret put ADMIN_PHONE
